<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GoOut AI-Geospatial Discovery Pipeline</title>
  <desc id="desc">Pipeline diagram showing user query, intent extraction, geospatial filtering, ranking, AI refinement, and output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; rx: 16; }
      .rank { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 16; }
      .ai { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 16; }
      .out { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 16; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .arrow { stroke: #1d4ed8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text class="label" x="40" y="48">AI-Geospatial Discovery Pipeline</text>

  <rect class="box" x="45" y="135" width="150" height="105"/>
  <text class="label" x="82" y="174">User</text>
  <text class="small" x="72" y="202">Natural-language</text>
  <text class="small" x="83" y="222">query + location</text>

  <rect class="box" x="255" y="135" width="160" height="105"/>
  <text class="label" x="286" y="174">Intent</text>
  <text class="small" x="286" y="202">Tokenization,</text>
  <text class="small" x="282" y="222">budget parsing</text>

  <rect class="box" x="475" y="135" width="170" height="105"/>
  <text class="label" x="506" y="174">Geo Filter</text>
  <text class="small" x="505" y="202">2dsphere search,</text>
  <text class="small" x="512" y="222">public places</text>

  <rect class="rank" x="705" y="95" width="190" height="185"/>
  <text class="label" x="760" y="132">Ranking</text>
  <text class="small" x="735" y="162">Relevance</text>
  <text class="small" x="735" y="184">Distance</text>
  <text class="small" x="735" y="206">Offers</text>
  <text class="small" x="735" y="228">Preferences</text>
  <text class="small" x="735" y="250">Sustainability</text>

  <rect class="ai" x="955" y="135" width="170" height="105"/>
  <text class="label" x="984" y="174">AI Refinement</text>
  <text class="small" x="992" y="202">Grounded Gemini</text>
  <text class="small" x="1002" y="222">response</text>

  <rect class="out" x="475" y="345" width="260" height="100"/>
  <text class="label" x="545" y="382">Output</text>
  <text class="small" x="520" y="410">Ranked places, itinerary,</text>
  <text class="small" x="525" y="430">trade-off explanation</text>

  <path class="arrow" d="M195 187 L255 187"/>
  <path class="arrow" d="M415 187 L475 187"/>
  <path class="arrow" d="M645 187 L705 187"/>
  <path class="arrow" d="M895 187 L955 187"/>
  <path class="arrow" d="M1040 240 C1010 340, 820 395, 735 395"/>
  <path class="arrow" d="M705 280 C670 330, 640 345, 615 345"/>
  <text class="small" x="65" y="485">The LLM is applied after retrieval and ranking so recommendations remain grounded in local merchant and map data.</text>
</svg>
